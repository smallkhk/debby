<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create your account — Eclipse Creator Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/app.css?v=202608081858" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a class="brand" href="/" style="margin-bottom:22px"><span class="logo"></span> Eclipse</a>

    <!-- Step 1 -->
    <div id="step1">
      <h1>Create your account</h1>
      <p class="sub">Free credits included — no card needed.</p>
      <div id="err1"></div>
      <form id="form1">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" type="text" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="new-password" minlength="6" required />
          <span class="hint">At least 6 characters.</span>
        </div>
        <button class="btn btn-primary btn-block" id="btn1" type="submit">Send verification code</button>
      </form>
      <div class="auth-foot">Already have an account? <a href="/login.html">Log in</a></div>
      <div class="auth-foot faint" style="margin-top:6px;font-size:.82rem">
        <a href="/index.html">See features &amp; pricing</a>
      </div>
    </div>

    <!-- Step 2 -->
    <div id="step2" class="hidden">
      <h1>Check your email</h1>
      <p class="sub">We sent a 6-digit code to <b id="emailEcho"></b>.</p>
      <div id="err2"></div>
      <form id="form2">
        <div class="field">
          <label for="otp">Verification code</label>
          <input id="otp" class="otp-input" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required />
        </div>
        <button class="btn btn-primary btn-block" id="btn2" type="submit">Verify &amp; create account</button>
      </form>
      <div class="auth-foot"><a href="#" id="backLink">← Use a different email</a></div>
    </div>
  </div>
</div>

<script src="/assets/js/app.js?v=202608081858"></script>
<script>
const step1 = document.getElementById('step1'), step2 = document.getElementById('step2');
let email = '';

function showErr(id, msg) {
  document.getElementById(id).innerHTML = msg ? `<div class="alert alert-err">${esc(msg)}</div>` : '';
}

document.getElementById('form1').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn1');
  btn.disabled = true; btn.textContent = 'Sending…'; showErr('err1', '');
  email = document.getElementById('email').value.trim();
  try {
    await API.post('/api/auth.php?action=send_otp', {
      name: document.getElementById('name').value.trim(),
      email,
      password: document.getElementById('password').value,
    });
    document.getElementById('emailEcho').textContent = email;
    step1.classList.add('hidden'); step2.classList.remove('hidden');
    document.getElementById('otp').focus();
  } catch (err) {
    showErr('err1', err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Send verification code';
  }
});

document.getElementById('form2').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn2');
  btn.disabled = true; btn.textContent = 'Verifying…'; showErr('err2', '');
  try {
    await API.post('/api/auth.php?action=verify_otp', { email, otp: document.getElementById('otp').value.trim() });
    location.href = '/studio.html';
  } catch (err) {
    showErr('err2', err.message);
    btn.disabled = false; btn.textContent = 'Verify & create account';
  }
});

document.getElementById('backLink').addEventListener('click', (e) => {
  e.preventDefault();
  step2.classList.add('hidden'); step1.classList.remove('hidden');
});
</script>
</body>
</html>
